<!DOCTYPE html>
<html lang="zh-Hant" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#bd6437">
<title>營建法規刷題 113–114</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
/* ============ THEME TOKENS ============ */
:root{
  --surround:#e7e0d2;
  --bg:#f3efe7;
  --surface:#ffffff;
  --surface-2:#faf6ee;
  --border:#e8e1d4;
  --border-strong:#d9d0bf;
  --text:#2b2823;
  --text-muted:#8a8175;
  --text-faint:#ada595;
  --accent:#bd6437;
  --accent-press:#a5532b;
  --accent-soft:#f6e7db;
  --ok:#3c8a55; --ok-bg:#e6f1e6; --ok-border:#c2e0c5;
  --bad:#c44f3e; --bad-bg:#fae5e0; --bad-border:#f0c8bf;
  --warn:#9a6a0f; --warn-bg:#fbeecb; --warn-border:#eed79a;
  --info:#3a6396; --info-bg:#e6eef6; --info-border:#c6d6e8;
  --law-bg:#2c2922; --law-2:#3a352b; --law-text:#e9e1d2; --law-accent:#e3a974;
  --shadow-sm:0 1px 2px rgba(60,48,30,.06);
  --shadow:0 1px 2px rgba(60,48,30,.05),0 6px 22px rgba(60,48,30,.07);
  --shadow-lg:0 8px 34px rgba(60,48,30,.12);
}
html[data-theme="dark"]{
  --surround:#100e0a;
  --bg:#17140f;
  --surface:#2a251c;
  --surface-2:#39322a;
  --border:#4d4432;
  --border-strong:#615641;
  --text:#ece5d8;
  --text-muted:#a59c8b;
  --text-faint:#776e5f;
  --accent:#d4794c;
  --accent-press:#bd6437;
  --accent-soft:#3a2b21;
  --ok:#6dbe83; --ok-bg:#253629; --ok-border:#3a5841;
  --bad:#e08272; --bad-bg:#392622; --bad-border:#5b3932;
  --warn:#e0b45c; --warn-bg:#393015; --warn-border:#5b4c23;
  --info:#85aedb; --info-bg:#212f3e; --info-border:#37506a;
  --law-bg:#16130d; --law-2:#221d14; --law-text:#e6ddca; --law-accent:#e3a974;
  --shadow-sm:0 1px 2px rgba(0,0,0,.3);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 22px rgba(0,0,0,.32);
  --shadow-lg:0 10px 36px rgba(0,0,0,.45);
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;overflow-x:hidden;}
body{
  background:var(--surround);
  color:var(--text);
  font-family:"Microsoft JhengHei","Microsoft JhengHei UI",system-ui,-apple-system,"PingFang TC","Noto Sans TC",sans-serif;
  -webkit-font-smoothing:antialiased;
  line-height:1.5;
  min-height:100vh;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
input{font-family:inherit;}
.hidden{display:none !important;}

/* ============ SHELL ============ */
.app{
  max-width:500px;
  margin:0 auto;
  min-height:100vh;
  background:var(--bg);
  position:relative;
  transition:background .25s ease;
}
@media (min-width:520px){
  .app{box-shadow:var(--shadow-lg);}
}

.appbar{
  position:sticky;top:0;z-index:30;
  background:color-mix(in srgb,var(--bg) 82%,transparent);
  backdrop-filter:saturate(140%) blur(14px);
  -webkit-backdrop-filter:saturate(140%) blur(14px);
  border-bottom:1px solid var(--border);
  padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;
  display:flex;align-items:center;justify-content:space-between;gap:10px;
}
.brand{display:flex;align-items:center;gap:10px;min-width:0;}
.brand__logo{
  width:38px;height:38px;flex:none;border-radius:11px;
  background:linear-gradient(150deg,var(--accent),var(--accent-press));
  color:#fff;display:flex;align-items:center;justify-content:center;
  font-family:"Microsoft JhengHei","Microsoft JhengHei UI",sans-serif;font-weight:700;font-size:20px;
  box-shadow:0 3px 10px color-mix(in srgb,var(--accent) 40%,transparent);
}
.brand__title{font-weight:900;font-size:16px;letter-spacing:.01em;line-height:1.15;white-space:nowrap;}
.brand__sub{font-size:11px;color:var(--text-faint);font-weight:500;letter-spacing:.04em;}
.appbar__right{display:flex;align-items:center;gap:8px;flex:none;}

.progress-pill{
  font-size:12px;font-weight:700;color:var(--accent);
  background:var(--accent-soft);padding:5px 10px;border-radius:999px;
  font-variant-numeric:tabular-nums;white-space:nowrap;
}
.iconbtn{
  width:36px;height:36px;border-radius:10px;flex:none;
  display:flex;align-items:center;justify-content:center;
  color:var(--text-muted);border:1px solid var(--border);background:var(--surface);
  transition:transform .12s,background .15s,color .15s;
}
.iconbtn:active{transform:scale(.9);}
.iconbtn svg{width:18px;height:18px;}
/* ---- Google Drive 同步狀態 ---- */
.iconbtn--sync.is-on{color:var(--ok);border-color:var(--ok-border);background:var(--ok-bg);}
.iconbtn--sync.is-busy{color:var(--accent);border-color:var(--accent);}
.iconbtn--sync.is-busy svg{animation:syncspin 1s linear infinite;}
.iconbtn--sync.is-err{color:var(--bad);border-color:var(--bad-border);background:var(--bad-bg);}
@keyframes syncspin{to{transform:rotate(360deg);}}
@media (prefers-reduced-motion:reduce){.iconbtn--sync.is-busy svg{animation:none;}}
.synctip{
  position:fixed;left:50%;transform:translateX(-50%);bottom:22px;z-index:120;
  max-width:min(92vw,420px);padding:11px 16px;border-radius:12px;
  background:var(--law-bg);color:var(--law-text);font-size:13px;line-height:1.6;
  box-shadow:0 6px 26px rgba(0,0,0,.28);opacity:0;pointer-events:none;
  transition:opacity .2s,transform .2s;
}
.synctip.show{opacity:1;transform:translateX(-50%) translateY(-4px);}
.synctip b{color:var(--law-accent);}
.user-chip{
  display:flex;align-items:center;gap:6px;max-width:130px;
  padding:6px 11px;border-radius:999px;font-size:12.5px;font-weight:700;
  background:var(--surface);border:1px solid var(--border);color:var(--text);
  transition:transform .12s;
}
.user-chip:active{transform:scale(.94);}
.user-chip__name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.user-chip svg{width:13px;height:13px;color:var(--text-faint);flex:none;}

main{
  padding:18px 16px 110px;
  animation:viewIn .32s ease;
}
@keyframes viewIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}

/* ============ BOTTOM TAB BAR ============ */
.tabbar{
  position:fixed;bottom:0;left:50%;transform:translateX(-50%);
  width:100%;max-width:500px;z-index:40;
  background:color-mix(in srgb,var(--surface) 88%,transparent);
  backdrop-filter:saturate(150%) blur(16px);
  -webkit-backdrop-filter:saturate(150%) blur(16px);
  border-top:1px solid var(--border);
  display:flex;
  padding-bottom:env(safe-area-inset-bottom);
}
.tab{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:11px 4px 13px;font-size:11.5px;font-weight:700;color:var(--text-faint);
  position:relative;transition:color .18s;
}
.tab svg{width:23px;height:23px;transition:transform .2s;}
.tab.active{color:var(--accent);}
.tab.active svg{transform:translateY(-1px);}
.tab.active::before{
  content:"";position:absolute;top:0;left:50%;transform:translateX(-50%);
  width:30px;height:3px;border-radius:0 0 4px 4px;background:var(--accent);
}
.tab:active svg{transform:scale(.86);}

/* ============ BUTTONS ============ */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  border-radius:13px;font-weight:700;font-size:14.5px;padding:13px 16px;
  transition:transform .12s,background .15s,box-shadow .15s;
}
.btn:active{transform:scale(.97);}
.btn--accent{background:var(--accent);color:#fff;box-shadow:0 4px 14px color-mix(in srgb,var(--accent) 36%,transparent);}
.btn--accent:active{background:var(--accent-press);}
.btn--soft{background:var(--surface-2);color:var(--text-muted);border:1px solid var(--border);}
.btn--ok{background:var(--ok);color:#fff;}
.btn--ghost{background:transparent;color:var(--accent);font-weight:700;}
.btn--block{width:100%;}

/* ============ USER SELECT ============ */
.hero{text-align:center;padding:26px 8px 22px;}
.hero__logo{
  width:62px;height:62px;margin:0 auto 14px;border-radius:18px;
  background:linear-gradient(150deg,var(--accent),var(--accent-press));
  color:#fff;display:flex;align-items:center;justify-content:center;
  font-family:"Microsoft JhengHei","Microsoft JhengHei UI",sans-serif;font-weight:700;font-size:34px;
  box-shadow:0 8px 22px color-mix(in srgb,var(--accent) 38%,transparent);
}
.hero__title{font-size:19px;font-weight:900;margin:0 0 5px;}
.hero__sub{font-size:13px;color:var(--text-muted);margin:0;max-width:300px;margin-inline:auto;}
.block{margin-bottom:22px;}
.block__label{font-size:12px;font-weight:700;color:var(--text-faint);letter-spacing:.05em;margin-bottom:10px;text-transform:uppercase;}
.user-row{
  width:100%;display:flex;align-items:center;gap:12px;text-align:left;
  background:var(--surface);border:1px solid var(--border);border-radius:15px;
  padding:13px 14px;margin-bottom:9px;box-shadow:var(--shadow-sm);
  transition:transform .12s,box-shadow .15s,border-color .15s;
}
.user-row:active{transform:scale(.98);border-color:var(--accent);box-shadow:var(--shadow);}
.user-row__avatar{
  width:38px;height:38px;flex:none;border-radius:11px;background:var(--accent-soft);
  color:var(--accent);display:flex;align-items:center;justify-content:center;
  font-weight:900;font-size:17px;
}
.user-row__name{flex:1;font-weight:700;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.user-row__go{color:var(--text-faint);font-size:16px;}
.empty-hint{font-size:13px;color:var(--text-faint);text-align:center;padding:18px;background:var(--surface-2);border-radius:13px;border:1px dashed var(--border-strong);}
.set-mixed{
  width:100%;display:flex;align-items:center;gap:12px;text-align:left;
  background:linear-gradient(150deg,var(--accent),var(--accent-press));
  color:#fff;border:none;border-radius:15px;padding:14px 15px;margin-bottom:9px;
  box-shadow:0 6px 18px color-mix(in srgb,var(--accent) 34%,transparent);
  transition:transform .12s;
}
.set-mixed:active{transform:scale(.98);}
.set-mixed__avatar{width:40px;height:40px;flex:none;border-radius:12px;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;font-size:21px;}
.set-mixed__name{font-weight:900;font-size:15.5px;}
.set-mixed__sub{font-size:11.5px;font-weight:600;opacity:.85;margin-top:1px;display:block;}
.set-mixed__go{font-size:18px;opacity:.9;flex:none;}
.newuser{display:flex;gap:9px;}
.newuser input{
  flex:1;min-width:0;border:1px solid var(--border-strong);background:var(--surface);
  border-radius:13px;padding:12px 14px;font-size:14.5px;color:var(--text);
  transition:border-color .15s,box-shadow .15s;
}
.newuser input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);}
.newuser input::placeholder{color:var(--text-faint);}

/* ============ PRACTICE CARD ============ */
.mode-strip{
  display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;
}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;padding:5px 11px;border-radius:999px;}
.pill--rose{background:var(--bad-bg);color:var(--bad);}
.pill--blue{background:var(--accent-soft);color:var(--accent);}
.pill--ghost{background:transparent;color:var(--text-faint);text-decoration:underline;text-underline-offset:2px;font-weight:600;}

/* 字級縮放：只作用在「閱讀內容」（題目、選項、解析、法條、錯題本），
   標題列與按鈕維持原大小。設定存在各裝置本機，不進雲端同步。 */
:root{ --fs:1; }

.card{
  background:var(--surface);border:1px solid var(--border);border-radius:20px;
  padding:18px 17px;box-shadow:var(--shadow);margin-bottom:16px;
}
.card__meta{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px;}
.qid{font-size:11px;font-weight:700;font-family:ui-monospace,"SF Mono",Menlo,monospace;color:var(--text-faint);letter-spacing:.02em;}
.qcount{font-size:12px;font-weight:700;color:var(--text-muted);font-variant-numeric:tabular-nums;}
.flags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px;}
.flag{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:4px 9px;border-radius:8px;}
.flag--warn{background:var(--warn-bg);color:var(--warn);border:1px solid var(--warn-border);}
.flag--rose{background:var(--bad-bg);color:var(--bad);}
.flag--easy{background:var(--accent);color:#fff;}
.qtext{
  font-size:calc(17px * var(--fs));font-weight:500;line-height:1.62;margin:0 0 16px;
  letter-spacing:.005em;overflow-wrap:anywhere;word-break:break-word;
  white-space:pre-wrap;text-wrap:pretty;
}

.opts{display:flex;flex-direction:column;gap:9px;}
.opt{
  display:flex;align-items:flex-start;gap:11px;text-align:left;width:100%;
  background:var(--surface-2);border:1.5px solid var(--border);border-radius:15px;
  padding:13px 14px;min-height:52px;font-size:calc(14.5px * var(--fs));line-height:1.5;color:var(--text);
  transition:transform .1s,border-color .15s,background .2s,box-shadow .15s;
  position:relative;overflow-wrap:anywhere;word-break:break-word;
}
.opt:not(:disabled):active{transform:scale(.98);border-color:var(--accent);box-shadow:0 4px 14px color-mix(in srgb,var(--accent) 18%,transparent);}
.opt__badge{
  width:calc(25px * var(--fs));height:calc(25px * var(--fs));flex:none;border-radius:8px;background:var(--surface);
  border:1px solid var(--border-strong);color:var(--text-muted);
  display:flex;align-items:center;justify-content:center;font-weight:900;font-size:calc(12.5px * var(--fs));
  transition:background .2s,color .2s,border-color .2s;
}
.opt__text{flex:1;padding-top:2px;font-weight:500;}
.opt__mark{flex:none;font-weight:900;font-size:16px;width:18px;text-align:center;align-self:center;opacity:0;transition:opacity .2s;}
.opt:disabled{cursor:default;}
.opt.correct{background:var(--ok-bg);border-color:var(--ok-border);color:var(--ok);}
.opt.correct .opt__badge{background:var(--ok);border-color:var(--ok);color:#fff;}
.opt.correct .opt__text{font-weight:700;}
.opt.correct .opt__mark{opacity:1;color:var(--ok);}
.opt.correct .opt__mark::before{content:"✓";}
.opt.wrong{background:var(--bad-bg);border-color:var(--bad-border);color:var(--bad);}
.opt.wrong .opt__badge{background:var(--bad);border-color:var(--bad);color:#fff;}
.opt.wrong .opt__text{font-weight:700;}
.opt.wrong .opt__mark{opacity:1;color:var(--bad);}
.opt.wrong .opt__mark::before{content:"✕";}
.opt.dim{opacity:.46;}

/* ============ ANSWER PANEL ============ */
.answer{margin-top:15px;display:flex;flex-direction:column;gap:10px;animation:panelIn .34s cubic-bezier(.2,.7,.3,1);}
@keyframes panelIn{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}
.banner{border-radius:14px;padding:13px 14px;border:1px solid transparent;}
.banner--ok{background:var(--ok-bg);border-color:var(--ok-border);}
.banner--bad{background:var(--bad-bg);border-color:var(--bad-border);}
.banner__head{font-weight:900;font-size:calc(15px * var(--fs));margin:0 0 4px;display:flex;align-items:center;gap:7px;}
.banner--ok .banner__head{color:var(--ok);}
.banner--bad .banner__head{color:var(--bad);}
.banner__ans{font-size:calc(13.5px * var(--fs));color:var(--text);}
.banner__ans b{font-weight:900;}
.banner__reason{font-size:calc(12px * var(--fs));color:var(--text-muted);margin-top:4px;overflow-wrap:anywhere;}

.alert{border-radius:14px;padding:13px 14px;border:1px solid transparent;}
.alert__label{font-size:calc(12px * var(--fs));font-weight:900;margin:0 0 6px;display:flex;align-items:center;gap:6px;letter-spacing:.02em;}
.alert__body{font-size:calc(13.5px * var(--fs));line-height:1.62;color:var(--text);overflow-wrap:anywhere;word-break:break-word;text-wrap:pretty;}
.alert--warn{background:var(--warn-bg);border-color:var(--warn-border);}
.alert--warn .alert__label{color:var(--warn);}
.alert--info{background:var(--info-bg);border-color:var(--info-border);}
.alert--info .alert__label{color:var(--info);}
.alert--neutral{background:var(--surface-2);border-color:var(--border);}
.alert--neutral .alert__label{color:var(--text-muted);}
.alert__meta{font-size:calc(11.5px * var(--fs));color:var(--text-faint);margin-top:8px;}

/* law article = dark document block */
.lawblock{
  background:var(--law-bg);border-radius:14px;padding:14px 15px;
  border:1px solid color-mix(in srgb,var(--law-bg) 70%,#000);
}
.lawblock__label{font-size:calc(12px * var(--fs));font-weight:900;color:var(--law-accent);margin:0 0 7px;display:flex;align-items:center;gap:6px;letter-spacing:.04em;}
.lawblock__body{
  font-family:"Microsoft JhengHei","Microsoft JhengHei UI",sans-serif;font-size:calc(14.5px * var(--fs));line-height:1.78;color:var(--law-text);
  overflow-wrap:anywhere;word-break:break-word;text-wrap:pretty;
}
.lawblock__body .law-art{color:var(--law-accent);font-weight:700;}

/* nav buttons */
.navrow{display:flex;gap:10px;margin-bottom:6px;}
.navrow .btn{flex:1;}

/* ============ REVIEW BOOK ============ */
.review-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;}
.review-head h2{font-size:18px;font-weight:900;margin:0;}
.count-strong{color:var(--accent);}
.tree{display:flex;flex-direction:column;gap:6px;}
.tnode{position:relative;}
.thead{
  width:100%;display:flex;align-items:center;gap:9px;text-align:left;
  background:var(--surface);border:1px solid var(--border);border-radius:13px;
  padding:11px 13px;transition:transform .1s,background .15s,border-color .15s;
}
.thead:active{transform:scale(.99);background:var(--surface-2);}
.tnode--d0 > .thead{font-weight:900;font-size:14.5px;}
.tnode--d1 > .thead{font-weight:700;font-size:13.5px;background:var(--surface-2);}
.tnode--d2 > .thead{font-weight:500;font-size:13px;background:transparent;border-style:dashed;}
.tchev{
  width:18px;height:18px;flex:none;color:var(--text-faint);
  transition:transform .26s cubic-bezier(.3,.7,.3,1);display:flex;align-items:center;justify-content:center;
}
.tnode.open > .thead .tchev{transform:rotate(90deg);}
.tlabel{flex:1;overflow-wrap:anywhere;word-break:break-word;}
.tcount{
  flex:none;font-size:11.5px;font-weight:900;color:var(--accent);
  background:var(--accent-soft);min-width:24px;text-align:center;
  padding:3px 8px;border-radius:999px;font-variant-numeric:tabular-nums;
}
.tbody{display:grid;grid-template-rows:0fr;transition:grid-template-rows .28s cubic-bezier(.3,.7,.3,1);}
.tbody > .tbody__in{overflow:hidden;}
.tnode.open > .tbody{grid-template-rows:1fr;}
.tbody__in{padding:6px 0 2px 12px;margin-top:5px;border-left:2px solid var(--border);display:flex;flex-direction:column;gap:6px;}

.witem{background:var(--surface);border:1px solid var(--border);border-radius:13px;padding:12px 13px;box-shadow:var(--shadow-sm);}
.witem__top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:7px;}
.witem__badges{display:flex;align-items:center;gap:6px;min-width:0;flex-wrap:wrap;}
.witem__easy{display:inline-flex;align-items:center;gap:3px;font-size:10.5px;font-weight:900;padding:3px 8px;border-radius:7px;background:var(--accent);color:#fff;letter-spacing:.02em;white-space:nowrap;}
.witem__top .qid{color:var(--bad);background:var(--bad-bg);padding:3px 8px;border-radius:7px;}
.witem__rm{font-size:11.5px;font-weight:700;color:var(--text-faint);padding:4px 8px;border-radius:8px;transition:background .15s,color .15s;}
.witem__rm:active{background:var(--bad-bg);color:var(--bad);}
.witem__q{font-size:calc(13.5px * var(--fs));font-weight:700;line-height:1.55;margin:0 0 7px;overflow-wrap:anywhere;word-break:break-word;white-space:pre-wrap;}
.witem__line{font-size:calc(12px * var(--fs));line-height:1.55;margin:3px 0;overflow-wrap:anywhere;word-break:break-word;}
.witem__line .lbl{font-weight:700;}
.witem__line.ans{color:var(--text-muted);}

<script>
const QUESTION_SETS = [
  { key: '114', label: '114 年題庫', file: '114_questions.json' },
  { key: '113', label: '113 年題庫', file: '113_questions.json' },
  { key: '112', label: '112 年題庫', file: '112_questions.json' },
  { key: '111', label: '111 年題庫', file: '111_questions.json' },
  { key: '110', label: '110 年題庫', file: '110_questions.json' },
  { key: '109', label: '109 年題庫', file: '109_questions.json' },
  { key: '108', label: '108 年題庫', file: '108_questions.json' },
  { key: '107', label: '107 年題庫', file: '107_questions.json' },
  { key: '106', label: '106 年題庫', file: '106_questions.json' },
  { key: '105', label: '105 年題庫', file: '105_questions.json' }
];
const LS_USERS_KEY = 'law_quiz_users_v1';
const LS_WRONG_PREFIX = 'law_quiz_wrong_v1__';
const LS_PROGRESS_PREFIX = 'law_quiz_progress_v1__';
const LS_THEME_KEY = 'law_quiz_theme_v1';
const LS_LASTSET_KEY = 'law_quiz_lastset_v1';
const LS_MIXED_PREFIX = 'law_quiz_mixed_v1__';
const MIXED_COUNT = 80;

/* 題庫檔更新後避免瀏覽器沿用舊快取。
   必須是固定字串（不可用 Date.now()），否則每次開頁都會重新下載全部題庫、
   GitHub Pages 的 CDN 快取也會完全失效。更新題庫 JSON 後把日期往後改一次即可。 */
const DATA_VERSION = '20260901';
function dataUrl(file) {
  return encodeURI(file) + '?v=' + DATA_VERSION;
}

let ALL_QUESTIONS = [];
let MIXED_POOL_BY_YEAR = {};
let currentIndex = 0;
let currentView = 'practice';
let shuffledOrder = [];
let currentUser = null;
let currentSet = null;
let isReviewPracticeMode = false;
let reviewOrder = [];
let reviewIndex = 0;

const mainArea = document.getElementById('mainArea');
const navPractice = document.getElementById('navPractice');
const navReview = document.getElementById('navReview');
const progressBadge = document.getElementById('progressBadge');
const bottomNav = document.getElementById('bottomNav');
const currentUserBadge = document.getElementById('currentUserBadge');
const switchUserBtn = document.getElementById('switchUserBtn');
const switchSetBtn = document.getElementById('switchSetBtn');
const brandSub = document.getElementById('brandSub');
const themeToggle = document.getElementById('themeToggle');
const exportDataBtn = document.getElementById('exportDataBtn');
const importFileInput = document.getElementById('importFileInput');

/* ---------- Theme ---------- */
const ICON_SUN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 1.5v2.5M12 20v2.5M4.2 4.2l1.8 1.8M18 18l1.8 1.8M1.5 12H4M20 12h2.5M4.2 19.8L6 18M18 6l1.8-1.8"/></svg>';
const ICON_MOON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A8.5 8.5 0 1 1 11.2 3a6.6 6.6 0 0 0 9.8 9.8z"/></svg>';
function applyTheme(t){
  document.documentElement.setAttribute('data-theme', t);
  themeToggle.innerHTML = (t === 'dark') ? ICON_SUN : ICON_MOON;
  try { localStorage.setItem(LS_THEME_KEY, t); } catch(e){}
}
(function initTheme(){
  let saved;
  try { saved = localStorage.getItem(LS_THEME_KEY); } catch(e){}
  if (!saved) saved = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
  applyTheme(saved);
})();
themeToggle.addEventListener('click', () => {
  const next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
  applyTheme(next);
});

/* ---------- 文字大小 ----------
   只影響閱讀內容。設定存在這台裝置，不進雲端同步，
   所以手機可以調大、電腦維持正常，兩邊互不干擾。 */
const LS_FONTSCALE_KEY = 'law_quiz_fontscale_v1';
const FONT_LEVELS = [
  { name: '標準', v: 1 },
  { name: '大',   v: 1.12 },
  { name: '特大', v: 1.26 },
  { name: '超大', v: 1.42 }
];
const fontScaleBtn = document.getElementById('fontScaleBtn');
let fontLevel = 0;

function applyFontLevel(i, announce) {
  fontLevel = Math.max(0, Math.min(FONT_LEVELS.length - 1, i));
  const lv = FONT_LEVELS[fontLevel];
  document.documentElement.style.setProperty('--fs', lv.v);
  fontScaleBtn.title = '文字大小：' + lv.name + '（點擊切換）';
  try { localStorage.setItem(LS_FONTSCALE_KEY, String(fontLevel)); } catch(e) {}
  if (announce) tip('文字大小：<b>' + lv.name + '</b>', 1600);
}
(function initFontScale() {
  let saved = null;
  try { saved = localStorage.getItem(LS_FONTSCALE_KEY); } catch(e) {}
  /* 沒設定過時，手機預設放大一級 */
  const def = (window.innerWidth <= 520) ? 1 : 0;
  applyFontLevel(saved === null ? def : parseInt(saved, 10) || 0, false);
})();
fontScaleBtn.addEventListener('click', () => {
  applyFontLevel((fontLevel + 1) % FONT_LEVELS.length, true);
});

/* ---------- Storage ---------- */
function loadUserList() {
  try { return JSON.parse(localStorage.getItem(LS_USERS_KEY)) || []; } catch(e) { return []; }
}
function saveUserList(list) {
  localStorage.setItem(LS_USERS_KEY, JSON.stringify(list));
}

/* 使用者的建立／刪除紀錄 { 名稱: { ts, deleted? } }。
   使用者清單只是名字陣列，合併時無法表達「刪除」——這份 meta 才是同步的依據，
   刪除留下墓碑，另一台裝置的舊清單就不會把已刪除的使用者復活。 */
const LS_USERMETA_KEY = 'law_quiz_usermeta_v1';
function loadUserMeta() {
  try { return JSON.parse(localStorage.getItem(LS_USERMETA_KEY)) || {}; } catch(e) { return {}; }
}
function saveUserMeta(m) {
  try { localStorage.setItem(LS_USERMETA_KEY, JSON.stringify(m)); } catch(e) {}
}
function markUser(name, deleted) {
  const m = loadUserMeta();
  m[name] = deleted ? { deleted: true, ts: Date.now() } : { ts: Date.now() };
  saveUserMeta(m);
}
function purgeUserLocal(name) {
  localStorage.removeItem(LS_WRONG_PREFIX + name);
  localStorage.removeItem(LS_MIXED_PREFIX + name);
  const pfx = LS_PROGRESS_PREFIX + name + '__';
  Object.keys(localStorage).forEach(k => { if (k.indexOf(pfx) === 0) localStorage.removeItem(k); });
}

function storageKeySuffix() {
  return currentUser + '__' + (currentSet ? currentSet.key : '');
}
/* 錯題複習本不分年度題庫，所有年度共用同一份紀錄，方便跨年度一起複習。
   為了雲端同步能正確處理「刪除」，被移除的題目不是真的刪掉，而是留下
   { deleted:true, ts } 的墓碑；顯示用的 loadWrongBook() 會濾掉墓碑。 */
function loadWrongBookRaw(user) {
  const u = user || currentUser;
  if (!u) return {};
  try { return JSON.parse(localStorage.getItem(LS_WRONG_PREFIX + u)) || {}; } catch(e) { return {}; }
}
function loadWrongBook() {
  const raw = loadWrongBookRaw();
  const out = {};
  Object.keys(raw).forEach(k => { if (raw[k] && !raw[k].deleted) out[k] = raw[k]; });
  return out;
}
function saveWrongBook(book) {
  if (!currentUser) return;
  const raw = loadWrongBookRaw();
  const out = Object.assign({}, book);
  const now = Date.now();
  Object.keys(raw).forEach(k => {
    if (k in out) return;
    out[k] = raw[k] && raw[k].deleted ? raw[k] : { deleted: true, ts: now };
  });
  localStorage.setItem(LS_WRONG_PREFIX + currentUser, JSON.stringify(out));
  scheduleCloudPush();
}
function loadProgress() {
  if (!currentUser) return { index: 0 };
  try { return JSON.parse(localStorage.getItem(LS_PROGRESS_PREFIX + storageKeySuffix())) || { index: 0 }; } catch(e) { return { index: 0 }; }
}
function saveProgress() {
  if (!currentUser) return;
  /* ts 供雲端同步比較新舊；舊資料沒有 ts，合併時視為最舊 */
  localStorage.setItem(LS_PROGRESS_PREFIX + storageKeySuffix(),
    JSON.stringify({ index: currentIndex, ts: Date.now() }));
  scheduleCloudPush();
}

/* ---------- Export / Import ---------- */
function exportUserData() {
  if (!currentUser) return;
  const payload = {
    type: 'law_quiz_backup',
    version: 2,
    user: currentUser,
    setKey: currentSet ? currentSet.key : '',
    exportedAt: new Date().toISOString(),
    progress: loadProgress(),
    wrongBook: loadWrongBook()
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const dateStr = new Date().toISOString().slice(0,10);
  a.href = url;
  a.download = `law_quiz_backup_${currentUser}_${(currentSet?currentSet.key:'set')}_${dateStr}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function importUserDataFromFile(file) {
  const reader = new FileReader();
  reader.onload = () => {
    let data;
    try { data = JSON.parse(reader.result); } catch(e) {
      alert('匯入失敗：檔案內容不是有效的JSON格式');
      return;
    }
    if (!data || data.type !== 'law_quiz_backup' || !data.user) {
      alert('匯入失敗：這不是有效的備份檔');
      return;
    }
    const targetUser = data.user;
    const targetSetKey = data.setKey || (currentSet ? currentSet.key : '');
    const progressSuffix = targetUser + '__' + targetSetKey;
    const users = loadUserList();
    if (!users.includes(targetUser)) {
      users.push(targetUser);
      saveUserList(users);
    }
    if (data.wrongBook && typeof data.wrongBook === 'object') {
      const existing = JSON.parse(localStorage.getItem(LS_WRONG_PREFIX + targetUser) || '{}');
      const merged = Object.assign({}, existing, data.wrongBook);
      localStorage.setItem(LS_WRONG_PREFIX + targetUser, JSON.stringify(merged));
    }
    if (data.progress && typeof data.progress === 'object') {
      localStorage.setItem(LS_PROGRESS_PREFIX + progressSuffix, JSON.stringify(data.progress));
    }
    alert(`已成功匯入使用者「${targetUser}」的備份資料！`);
    renderUserSelectScreen();
  };
  reader.onerror = () => alert('讀取檔案失敗');
  reader.readAsText(file);
}

exportDataBtn.addEventListener('click', exportUserData);
importFileInput.addEventListener('change', (e) => {
  const file = e.target.files && e.target.files[0];
  if (file) importUserDataFromFile(file);
  importFileInput.value = '';
});

/* ==================================================================
   Google Drive 雲端同步
   ------------------------------------------------------------------
   進度存在 Drive 的 appDataFolder（隱藏的專屬資料夾，Drive 介面看不到，
   也碰不到你其他檔案）。權限範圍只有 drive.appdata。
   localStorage 永遠是主要來源，雲端只是同步層——沒網路 / 沒登入時
   一切照常運作，只是不會同步。
   ================================================================== */
const GOOGLE_CLIENT_ID = '942430574491-ssp5mtn63bvhukn5o3sln7uas3jqhfsk.apps.googleusercontent.com';
const DRIVE_SCOPE = 'https://www.googleapis.com/auth/drive.appdata';
const SYNC_FILE_NAME = 'law_quiz_sync.json';
const LS_TOKEN_KEY = 'law_quiz_gtoken_v1';
const LS_LINKED_KEY = 'law_quiz_glinked_v1';

const cloudSyncBtn = document.getElementById('cloudSyncBtn');
const syncTipEl = document.getElementById('syncTip');

let gTokenClient = null;
let gToken = null;          // { access_token, exp }
let cloudFileId = null;
let pushTimer = null;
let lastPushedSig = null;
let syncing = false;
let lastRemote = null;          // 上次同步後的內容，配合 modifiedTime 省下重複下載
let lastRemoteModified = null;

function tip(html, ms) {
  syncTipEl.innerHTML = html;
  syncTipEl.classList.add('show');
  clearTimeout(tip._t);
  tip._t = setTimeout(() => syncTipEl.classList.remove('show'), ms || 3200);
}
function setSyncState(state, title) {
  cloudSyncBtn.classList.remove('is-on', 'is-busy', 'is-err');
  if (state !== 'off') cloudSyncBtn.classList.add('is-' + state);
  cloudSyncBtn.title = title || 'Google 雲端同步';
}

/* ---------- 權杖 ---------- */
function loadToken() {
  try {
    const t = JSON.parse(localStorage.getItem(LS_TOKEN_KEY));
    if (t && t.access_token && t.exp > Date.now() + 60000) return t;
  } catch(e) {}
  return null;
}
function saveToken(resp) {
  gToken = { access_token: resp.access_token, exp: Date.now() + (resp.expires_in || 3600) * 1000 };
  try { localStorage.setItem(LS_TOKEN_KEY, JSON.stringify(gToken)); } catch(e) {}
  try { localStorage.setItem(LS_LINKED_KEY, '1'); } catch(e) {}
}
function clearToken() {
  gToken = null;
  try { localStorage.removeItem(LS_TOKEN_KEY); } catch(e) {}
}
function isLinked() {
  try { return localStorage.getItem(LS_LINKED_KEY) === '1'; } catch(e) { return false; }
}

function ensureTokenClient() {
  if (gTokenClient) return true;
  if (!(window.google && google.accounts && google.accounts.oauth2)) return false;
  gTokenClient = google.accounts.oauth2.initTokenClient({
    client_id: GOOGLE_CLIENT_ID,
    scope: DRIVE_SCOPE,
    callback: (resp) => {
      if (resp && resp.access_token) {
        saveToken(resp);
        cloudSync({ announce: true });
      } else {
        setSyncState('err', '登入失敗');
        tip('登入失敗，請再試一次。');
      }
    },
    error_callback: (err) => {
      setSyncState(isLinked() ? 'err' : 'off', '尚未登入');
      /* 使用者自己關掉視窗就安靜略過，不要跳訊息 */
      if (err && (err.type === 'popup_closed' || err.type === 'popup_failed_to_open')) return;
      tip('無法開啟 Google 登入視窗，請確認瀏覽器沒有封鎖彈出視窗。', 5000);
    }
  });
  return true;
}

/* 要求權杖。silent=true 時不顯示同意畫面，用於開頁自動續期 */
function requestToken(silent) {
  if (!ensureTokenClient()) {
    tip('Google 登入元件尚未載入完成，請稍候再試。');
    return;
  }
  setSyncState('busy', '連線中…');
  gTokenClient.requestAccessToken({ prompt: silent ? '' : 'consent' });
}

/* ---------- Drive API ---------- */
async function driveFetch(url, opts) {
  const o = Object.assign({}, opts);
  o.headers = Object.assign({}, o.headers, { Authorization: 'Bearer ' + gToken.access_token });
  const r = await fetch(url, o);
  if (r.status === 401) { clearToken(); throw new Error('TOKEN_EXPIRED'); }
  if (!r.ok) throw new Error('Drive API ' + r.status);
  return r;
}
/* 只取檔案資訊（很小），用 modifiedTime 判斷雲端有沒有變，
   沒變就不必重新下載整包資料——密集使用時可省下大量流量 */
async function driveStat() {
  const q = encodeURIComponent("name='" + SYNC_FILE_NAME + "' and trashed=false");
  const r = await driveFetch('https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&fields=files(id,name,modifiedTime)&q=' + q);
  const d = await r.json();
  const f = (d.files && d.files[0]) || null;
  cloudFileId = f ? f.id : null;
  return f;
}
async function driveDownload(id) {
  const r = await driveFetch('https://www.googleapis.com/drive/v3/files/' + id + '?alt=media');
  return r.json();
}
async function driveSave(id, payload) {
  const content = JSON.stringify(payload);
  if (id) {
    const r = await driveFetch('https://www.googleapis.com/upload/drive/v3/files/' + id + '?uploadType=media&fields=id,modifiedTime', {
      method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: content
    });
    return r.json();
  }
  const boundary = 'quizsync' + Date.now();
  const meta = { name: SYNC_FILE_NAME, parents: ['appDataFolder'] };
  const body =
    '--' + boundary + '\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n' + JSON.stringify(meta) +
    '\r\n--' + boundary + '\r\nContent-Type: application/json\r\n\r\n' + content +
    '\r\n--' + boundary + '--';
  const r = await driveFetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id,modifiedTime', {
    method: 'POST', headers: { 'Content-Type': 'multipart/related; boundary=' + boundary }, body
  });
  const d = await r.json();
  cloudFileId = d.id;
  return d;
}

/* ---------- 本機資料的收集與寫回 ---------- */
function collectLocal() {
  const users = loadUserList();
  const wrong = {}, progress = {}, mixed = {};
  users.forEach(u => {
    const w = loadWrongBookRaw(u);
    if (Object.keys(w).length) wrong[u] = w;
  });
  for (let i = 0; i < localStorage.length; i++) {
    const k = localStorage.key(i);
    if (!k) continue;
    if (k.indexOf(LS_PROGRESS_PREFIX) === 0) {
      try { progress[k.slice(LS_PROGRESS_PREFIX.length)] = JSON.parse(localStorage.getItem(k)); } catch(e) {}
    } else if (k.indexOf(LS_MIXED_PREFIX) === 0) {
      try { mixed[k.slice(LS_MIXED_PREFIX.length)] = JSON.parse(localStorage.getItem(k)); } catch(e) {}
    }
  }
  return { type: 'law_quiz_cloud', version: 2, updatedAt: Date.now(),
           users, usersMeta: loadUserMeta(), wrong, progress, mixed };
}

function mergePayload(local, remote) {
  if (!remote || remote.type !== 'law_quiz_cloud') return local;
  const out = { type: 'law_quiz_cloud', version: 2, updatedAt: Date.now(),
                users: [], usersMeta: {}, wrong: {}, progress: {}, mixed: {} };

  /* 使用者：以 usersMeta 的時間為準，較新的動作（建立或刪除）勝出。
     舊版雲端檔沒有 usersMeta，那些名字視為「存在、時間 0」，
     所以任何一邊的刪除墓碑（ts>0）都會蓋過它。 */
  const lm = local.usersMeta || {}, rm = remote.usersMeta || {};
  const names = new Set([].concat(local.users || [], remote.users || [],
                                  Object.keys(lm), Object.keys(rm)));
  names.forEach(n => {
    const a = lm[n], b = rm[n];
    let win;
    if (a && b) win = ((b.ts || 0) > (a.ts || 0)) ? b : a;
    else win = a || b || { ts: 0 };          /* 舊資料：存在，時間最早 */
    out.usersMeta[n] = win;
    if (!win.deleted) out.users.push(n);
  });
  const removed = Object.keys(out.usersMeta).filter(n => out.usersMeta[n].deleted);

  /* 錯題本：逐題比 ts 取新的；墓碑同樣參與比較，所以刪除不會被復活 */
  const allU = new Set([].concat(Object.keys(local.wrong || {}), Object.keys(remote.wrong || {})));
  allU.forEach(u => {
    const a = (local.wrong || {})[u] || {}, b = (remote.wrong || {})[u] || {};
    const m = {};
    new Set([].concat(Object.keys(a), Object.keys(b))).forEach(id => {
      const ea = a[id], eb = b[id];
      if (!ea) { m[id] = eb; return; }
      if (!eb) { m[id] = ea; return; }
      m[id] = ((eb.ts || 0) > (ea.ts || 0)) ? eb : ea;
    });
    out.wrong[u] = m;
  });

  /* 各年度進度：比 ts 取新的（舊資料沒 ts 視為最舊） */
  const allP = new Set([].concat(Object.keys(local.progress || {}), Object.keys(remote.progress || {})));
  allP.forEach(k => {
    const a = (local.progress || {})[k], b = (remote.progress || {})[k];
    if (!a) { out.progress[k] = b; return; }
    if (!b) { out.progress[k] = a; return; }
    out.progress[k] = ((b.ts || 0) > (a.ts || 0)) ? b : a;
  });

  /* 綜合測驗的抽題順序：以本機為準，本機沒有才用雲端的 */
  out.mixed = Object.assign({}, remote.mixed || {}, local.mixed || {});

  /* 已刪除的使用者，連同他的錯題本、進度、綜合測驗紀錄一併清掉，
     否則資料會永遠留在雲端檔裡，而且每次同步又被寫回各裝置 */
  removed.forEach(n => {
    delete out.wrong[n];
    delete out.mixed[n];
    const pfx = n + '__';
    Object.keys(out.progress).forEach(k => { if (k.indexOf(pfx) === 0) delete out.progress[k]; });
  });
  return out;
}

function applyMerged(m) {
  saveUserMeta(m.usersMeta || {});
  /* 正在使用中的帳號即使在別台被刪除，也先留著不動，
     避免作答到一半資料突然消失；離開這個帳號後下次同步才會生效 */
  const list = (m.users || []).slice();
  if (currentUser && list.indexOf(currentUser) === -1) list.push(currentUser);
  saveUserList(list);

  Object.keys(m.usersMeta || {}).forEach(n => {
    if (m.usersMeta[n].deleted && n !== currentUser) purgeUserLocal(n);
  });

  Object.keys(m.wrong || {}).forEach(u => {
    localStorage.setItem(LS_WRONG_PREFIX + u, JSON.stringify(m.wrong[u]));
  });
  Object.keys(m.progress || {}).forEach(k => {
    if (m.progress[k]) localStorage.setItem(LS_PROGRESS_PREFIX + k, JSON.stringify(m.progress[k]));
  });
  Object.keys(m.mixed || {}).forEach(k => {
    if (m.mixed[k]) localStorage.setItem(LS_MIXED_PREFIX + k, JSON.stringify(m.mixed[k]));
  });
}

function payloadSig(p) {
  return JSON.stringify([p.users, p.usersMeta || {}, p.wrong, p.progress]);
}

/* ---------- 主流程 ---------- */
async function cloudSync(opts) {
  opts = opts || {};
  if (syncing) return;
  if (!gToken) gToken = loadToken();
  if (!gToken) { setSyncState(isLinked() ? 'err' : 'off', '尚未登入'); return; }

  syncing = true;
  setSyncState('busy', '同步中…');
  try {
    const stat = await driveStat();
    let remote = null;
    if (stat) {
      if (lastRemote && lastRemoteModified && stat.modifiedTime === lastRemoteModified) {
        remote = lastRemote;            /* 雲端沒被別台裝置改過，省下一次下載 */
      } else {
        try { remote = await driveDownload(stat.id); } catch(e) { remote = null; }
      }
    }

    const local = collectLocal();
    const merged = mergePayload(local, remote);
    applyMerged(merged);

    const sig = payloadSig(merged);
    if (sig !== payloadSig(remote || { users: [], wrong: {}, progress: {} })) {
      const saved = await driveSave(stat ? stat.id : null, merged);
      lastRemoteModified = saved && saved.modifiedTime ? saved.modifiedTime : null;
    } else {
      lastRemoteModified = stat ? stat.modifiedTime : null;
    }
    lastRemote = merged;
    lastPushedSig = sig;

    setSyncState('on', '已同步 · ' + new Date().toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit' }));
    if (opts.announce) {
      const n = Object.keys(merged.wrong || {}).reduce((s, u) =>
        s + Object.keys(merged.wrong[u]).filter(k => !merged.wrong[u][k].deleted).length, 0);
      tip('<b>已連結 Google 雲端</b><br>使用者 ' + (merged.users || []).length +
          ' 位 · 錯題 ' + n + ' 題已同步', 4200);
    }
    /* 停在選擇畫面時才重繪，避免把正在作答的人打斷 */
    if (opts.refresh && !currentUser) renderSetSelectScreen();
  } catch (err) {
    if (err && err.message === 'TOKEN_EXPIRED') {
      setSyncState('err', '登入已過期');
      tip('Google 登入已過期，點右上角同步圖示重新登入即可。<br>你的進度都還在這台裝置上。', 5000);
    } else {
      setSyncState('err', '同步失敗');
      tip('同步失敗：' + (err && err.message ? err.message : '未知錯誤') + '<br>進度仍安全保存在本機。', 5000);
    }
  } finally {
    syncing = false;
  }
}

/* 作答 / 換題後延遲推送，避免每按一下就打一次 API */
function scheduleCloudPush() {
  if (!gToken && !loadToken()) return;
  clearTimeout(pushTimer);
  pushTimer = setTimeout(() => {
    const sig = payloadSig(collectLocal());
    if (sig === lastPushedSig) return;   /* 沒變就不推 */
    cloudSync();
  }, 6000);
}

function cloudDisconnect() {
  const tk = gToken || loadToken();
  if (tk && window.google && google.accounts && google.accounts.oauth2) {
    try { google.accounts.oauth2.revoke(tk.access_token); } catch(e) {}
  }
  clearToken();
  cloudFileId = null;
  lastPushedSig = null;
  try { localStorage.removeItem(LS_LINKED_KEY); } catch(e) {}
  setSyncState('off', '尚未登入');
  tip('已中斷連結。<br>這台裝置的進度不受影響，仍保留在本機。', 4200);
}

function initCloudSync() {
  setSyncState('off', isLinked() ? '點擊重新連線' : '點擊以連結 Google 雲端同步');

  cloudSyncBtn.addEventListener('click', () => {
    const tk = gToken || loadToken();
    if (!tk) { requestToken(isLinked()); return; }   /* 曾經連結過就先試靜默續期 */
    if (confirm('已連結 Google 雲端同步。\n\n按「確定」立即同步一次\n按「取消」中斷連結')) {
      cloudSync({ announce: true, refresh: true });
    } else {
      cloudDisconnect();
    }
  });

  /* 開頁時：曾經連結過就自動同步一次 */
  if (isLinked()) {
    const tk = loadToken();
    if (tk) { gToken = tk; setTimeout(() => cloudSync({ refresh: true }), 800); }
    else { setTimeout(() => requestToken(true), 1200); }   /* 靜默續期 */
  }

  /* 切走分頁 / 關閉前把最後的變更推上去。
     手機（尤其 iOS）強制關閉 App 時 visibilitychange 不一定會觸發，
     所以同時掛 pagehide 作為保險。 */
  const flushOnLeave = () => {
    clearTimeout(pushTimer);
    if (!(gToken || loadToken())) return;
    if (payloadSig(collectLocal()) === lastPushedSig) return;
    cloudSync();
  };
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden') flushOnLeave();
  });
  window.addEventListener('pagehide', flushOnLeave);
}

function saveMixedIds(ids) {
  if (!currentUser) return;
  try { localStorage.setItem(LS_MIXED_PREFIX + currentUser, JSON.stringify(ids)); } catch(e){}

function sampleMixedQuestions(targetTotal) {
  const years = Object.keys(MIXED_POOL_BY_YEAR).filter(k => MIXED_POOL_BY_YEAR[k] && MIXED_POOL_BY_YEAR[k].length);
  if (!years.length) return [];
  const total = Math.min(targetTotal, years.reduce((n, y) => n + MIXED_POOL_BY_YEAR[y].length, 0));
  const perYear = Math.floor(total / years.length);
  let remainder = total - perYear * years.length;
  const shuffledYearPools = {};
  years.forEach(y => { shuffledYearPools[y] = shuffleArray(MIXED_POOL_BY_YEAR[y]); });
  let picked = [];
  years.forEach(y => {
    let take = perYear + (remainder > 0 ? 1 : 0);
    if (remainder > 0) remainder--;
    picked = picked.concat(shuffledYearPools[y].slice(0, Math.min(take, shuffledYearPools[y].length)));
  });
  if (picked.length < total) {
    const have = new Set(picked.map(q => q.id));
    const rest = shuffleArray(years.reduce((acc, y) => acc.concat(MIXED_POOL_BY_YEAR[y]), []).filter(q => !have.has(q.id)));
    picked = picked.concat(rest.slice(0, total - picked.length));
  }
  return shuffleArray(picked);
}

function buildMixedQuestions() {
  const byId = {};
  Object.values(MIXED_POOL_BY_YEAR).forEach(arr => arr.forEach(q => { byId[q.id] = q; }));
  let ids = [];
  try { ids = JSON.parse(localStorage.getItem(LS_MIXED_PREFIX + currentUser)) || []; } catch(e){}
  let questions = ids.map(id => byId[id]).filter(Boolean);
  if (questions.length === 0) {
    questions = sampleMixedQuestions(MIXED_COUNT);
    saveMixedIds(questions.map(q => q.id));
  }
  return questions;
}

  }).join('');

  const flags = [];
  if (isMultiAnswer(q)) flags.push('<span class="flag flag--warn">⚠ 多重給分／送分疑義題</span>');
  if (isEasyWrong) flags.push('<span class="flag flag--easy">⚠ 易錯題目</span>');
  else if (isWrongBefore) flags.push('<span class="flag flag--rose">📕 曾錯過</span>');

  mainArea.innerHTML = `
  ${isReview ? `<div class="mode-strip">
    <span class="pill pill--rose">📕 錯題練習模式</span>
    <button id="exitReviewPracticeBtn" class="pill pill--ghost">結束練習，返回複習本</button>
  </div>` : ''}
  ${isMixed ? `<div class="mode-strip">
    <span class="pill pill--blue">🎲 綜合測驗</span>
    <button id="reshuffleMixedBtn" class="pill pill--ghost">重新隨機抽題</button>
  </div>` : ''}
  <div class="card">
    <div class="card__meta">
      <span class="qid">${escapeHtml(q.id)}</span>
      <span class="qcount">${escapeHtml(qIndexLabel)}</span>
    </div>
    ${flags.length ? `<div class="flags">${flags.join('')}</div>` : ''}
    <p class="qtext">${escapeHtml(q.question)}</p>
    <div id="optionsWrap" class="opts">${optionsHtml}</div>
    <div id="answerPanel" class="answer hidden"></div>
  </div>
  <div class="navrow">
    <button id="prevBtn" class="btn btn--soft">← 上一題</button>
    <button id="nextBtn" class="btn btn--accent">下一題 →</button>
  </div>
  `;

  document.querySelectorAll('.option-btn').forEach(btn => {
    btn.addEventListener('click', () => handleAnswer(q, btn, isReview));
  });
  if (isReview) {
    document.getElementById('exitReviewPracticeBtn').addEventListener('click', () => {
      isReviewPracticeMode = false;
      renderReviewView();
    });
    document.getElementById('prevBtn').addEventListener('click', () => {
      reviewIndex = (reviewIndex - 1 + reviewOrder.length) % reviewOrder.length;
      showReviewPracticeQuestion();
    });
    document.getElementById('nextBtn').addEventListener('click', () => {
      reviewIndex = (reviewIndex + 1) % reviewOrder.length;
      showReviewPracticeQuestion();
    });
  } else {
    document.getElementById('prevBtn').addEventListener('click', () => {
      currentIndex = (currentIndex - 1 + shuffledOrder.length) % shuffledOrder.length;
      saveProgress();
      showPracticeQuestion();
    });
    document.getElementById('nextBtn').addEventListener('click', () => {
      currentIndex = (currentIndex + 1) % shuffledOrder.length;
      saveProgress();
      showPracticeQuestion();
    });
  }

  const reshuffleBtn = document.getElementById('reshuffleMixedBtn');
  if (reshuffleBtn) reshuffleBtn.addEventListener('click', () => {
    if (!confirm('要重新隨機抽 ' + MIXED_COUNT + ' 題嗎？目前的綜合測驗作答進度會重置。')) return;
    ALL_QUESTIONS = sampleMixedQuestions(MIXED_COUNT);
    saveMixedIds(ALL_QUESTIONS.map(q => q.id));
    shuffledOrder = ALL_QUESTIONS.map(q => q.id);
    currentIndex = 0;
    saveProgress();
    showPracticeQuestion();
  });
}

function handleAnswer(q, clickedBtn, isReview) {
  const selected = clickedBtn.getAttribute('data-opt');
  const correctSet = new Set((q.correct_answer || []).map(a => String(a)));
  const isCorrect = correctSet.has(selected);

  document.querySelectorAll('.option-btn').forEach(btn => {
    btn.disabled = true;
    const val = btn.getAttribute('data-opt');
    if (correctSet.has(val)) {
      btn.classList.add('correct');
    } else if (btn === clickedBtn) {
      btn.classList.add('wrong');
    } else {
      btn.classList.add('dim');
    }
  });

  const wrongBook = loadWrongBook();
  if (!isCorrect) {
    const prev = wrongBook[q.id] || {};
    const entry = {
      ts: Date.now(),
      question: q,
      wrongInMixed: !!prev.wrongInMixed,
      wrongInYears: Object.assign({}, prev.wrongInYears)
    };
    if (!isReview && currentSet) {
      if (currentSet.mixed) entry.wrongInMixed = true;
      else entry.wrongInYears[currentSet.key] = true;
    }
    wrongBook[q.id] = entry;
    saveWrongBook(wrongBook);
  }

  const multi = isMultiAnswer(q);
  const panel = document.getElementById('answerPanel');
  panel.classList.remove('hidden');
  panel.innerHTML = `
    <div class="banner ${isCorrect ? 'banner--ok' : 'banner--bad'}">
      <p class="banner__head">${isCorrect ? '✓ 答對了！' : '✕ 答錯了'}</p>
      <p class="banner__ans">正確答案：<b>${q.correct_answer.map(escapeHtml).join('、')}</b></p>
      ${(!multi && q.answer_reason) ? `<p class="banner__reason">${escapeHtml(q.answer_reason)}</p>` : ''}
    </div>
    ${multi ? `<div class="alert alert--warn">
      <p class="alert__label">⚠ 考選部多重給分／送分提示</p>
      <p class="alert__body">${escapeHtml(q.answer_reason || '本題經官方公告調整給分，請以最新公告之標準答案為準。')}</p>
    </div>` : ''}
    <div class="lawblock">
      <p class="lawblock__label">📖 法規條文</p>
      <p class="lawblock__body">${formatLawArticle(q.law_article)}</p>
    </div>
    <div class="alert alert--neutral">
      <p class="alert__label">💡 詳細解析</p>
      <p class="alert__body">${escapeHtml(q.explanation || '')}</p>
      <p class="alert__meta">分類：${escapeHtml(q.law_category || '未分類')}</p>
    </div>
    <div class="alert alert--info">
      <p class="alert__label">🔁 易混淆延伸對比</p>
      <p class="alert__body">${escapeHtml(q.extended_notes || '')}</p>
    </div>
    ${isReview ? `<button id="removeFromWrongBtn" class="btn ${isCorrect ? 'btn--ok' : 'btn--soft'} btn--block">${isCorrect ? '✓ 這題已掌握，移出複習本' : '仍未掌握，保留在複習本（移出）'}</button>` : ''}
  `;

  if (isReview) {
    document.getElementById('removeFromWrongBtn').addEventListener('click', () => {
      const book = loadWrongBook();
      delete book[q.id];
      saveWrongBook(book);
      reviewOrder = reviewOrder.filter(id => id !== q.id);
      if (reviewOrder.length === 0) {
        isReviewPracticeMode = false;
        renderReviewView();
        return;
      }
      reviewIndex = reviewIndex % reviewOrder.length;
      showReviewPracticeQuestion();
    });
  }
}

function showPracticeQuestion() {
  const q = ALL_QUESTIONS.find(x => x.id === shuffledOrder[currentIndex]);
  progressBadge.textContent = `${currentIndex+1} / ${shuffledOrder.length}`;
  renderPracticeCard(q, `第 ${currentIndex+1} 題 / 共 ${shuffledOrder.length} 題`, false);
}

function renderPracticeView() {
  isReviewPracticeMode = false;
  setActiveNav('practice');
  progressBadge.classList.remove('hidden');
  if (currentSet) brandSub.textContent = currentSet.label;
  if (shuffledOrder.length === 0) {
    shuffledOrder = ALL_QUESTIONS.map(q => q.id);
  }
  showPracticeQuestion();
}

/* ---------- Review Practice Mode ---------- */
function shuffleArray(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function startReviewPractice() {
  const wrongBook = loadWrongBook();
  reviewOrder = shuffleArray(Object.keys(wrongBook));
  if (reviewOrder.length === 0) return;
  reviewIndex = 0;
  isReviewPracticeMode = true;
  showReviewPracticeQuestion();
}

function showReviewPracticeQuestion() {
  const wrongBook = loadWrongBook();
  const id = reviewOrder[reviewIndex];
  const q = (wrongBook[id] && wrongBook[id].question) || ALL_QUESTIONS.find(x => x.id === id);
  if (!q) { renderReviewView(); return; }
  progressBadge.classList.remove('hidden');
  progressBadge.textContent = `${reviewIndex+1} / ${reviewOrder.length}`;
  renderPracticeCard(q, `錯題練習 第 ${reviewIndex+1} 題 / 共 ${reviewOrder.length} 題`, true);
}

/* ---------- Review Book ---------- */
function buildCategoryTree(items) {
  const tree = {};
  items.forEach((it) => {
    const q = it.q;
    const path = (q.law_category || '未分類').split('/').map(s => s.trim()).filter(Boolean);
    let node = tree;
    path.forEach((seg, i) => {
      if (!node[seg]) node[seg] = { __children: {}, __items: [] };
      if (i === path.length - 1) node[seg].__items.push(it);
      node = node[seg].__children;
    });
  });
  return tree;
}

const CHEV = '<svg class="tchev-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>';

function renderTreeNode(node, depth, pathKey) {
  let html = '';
  Object.keys(node).forEach(key => {
    const entry = node[key];
    const nodeId = `${pathKey}__${key}`.replace(/[^a-zA-Z0-9_一-鿿]/g, '_');
    const childCount = countAllItems(entry);
    html += `
    <div class="tnode tnode--d${depth>2?2:depth}">
      <button class="thead tree-toggle" data-target="${nodeId}">
        <span class="tchev">${CHEV}</span>
        <span class="tlabel">${escapeHtml(key)}</span>
        <span class="tcount">${childCount}</span>
      </button>
      <div id="${nodeId}" class="tbody">
        <div class="tbody__in">
          ${renderTreeNode(entry.__children, depth+1, nodeId)}
          ${entry.__items.map(it => renderWrongItem(it)).join('')}
        </div>
      </div>
    </div>`;
  });
  return html;
}

function countAllItems(entry) {
  let count = entry.__items.length;
  Object.values(entry.__children).forEach(child => { count += countAllItems(child); });
  return count;
}

function renderWrongItem({ id, q, entry }) {
  const easy = !!(entry && entry.wrongInMixed && entry.wrongInYears && Object.keys(entry.wrongInYears).length > 0);
  return `
  <div class="witem">
    <div class="witem__top">
      <span class="witem__badges">
        <span class="qid">${escapeHtml(id)}</span>
        ${easy ? '<span class="witem__easy">⚠ 易錯題目</span>' : ''}
      </span>
      <button class="witem__rm remove-wrong-btn" data-id="${escapeHtml(id)}">移除 ✕</button>
    </div>
    <p class="witem__q">${escapeHtml(q.question)}</p>
    <p class="witem__line ans"><span class="lbl">正確答案：</span>${(q.correct_answer||[]).map(escapeHtml).join('、')}</p>
    <p class="witem__line law"><span class="lbl">📖</span> ${escapeHtml(q.law_article || '')}</p>
    <p class="witem__line exp"><span class="lbl">💡</span> ${escapeHtml(q.explanation || '')}</p>
    <p class="witem__line ext"><span class="lbl">🔁</span> ${escapeHtml(q.extended_notes || '')}</p>
  </div>`;
}

function renderReviewView() {
  isReviewPracticeMode = false;
  setActiveNav('review');
  progressBadge.classList.add('hidden');
  brandSub.textContent = '錯題複習本';
  const wrongBook = loadWrongBook();
  const items = Object.keys(wrongBook).map(id => ({ id, q: wrongBook[id].question, entry: wrongBook[id] }));

  if (items.length === 0) {
    mainArea.innerHTML = `<div class="center-state">
      <div class="center-state__emoji">🎉</div>
      <p>目前沒有錯題</p>
      <p style="color:var(--text-faint);font-size:13px;margin-top:4px;">繼續刷題，答錯的題目會自動收進複習本</p>
    </div>`;
    return;
  }

  const tree = buildCategoryTree(items);
  mainArea.innerHTML = `
    <div class="review-head">
      <h2>錯題複習本 <span class="count-strong">${items.length}</span> 題</h2>
      <button id="clearAllWrongBtn" class="pill pill--ghost">清空全部</button>
    </div>
    <button id="startReviewPracticeBtn" class="btn btn--accent btn--block" style="margin-bottom:16px;">🔄 開始錯題重新挑戰（${items.length} 題）</button>
    <div class="tree" id="treeWrap">${renderTreeNode(tree, 0, 'root')}</div>
  `;

  const startBtn = document.getElementById('startReviewPracticeBtn');
  if (startBtn) startBtn.addEventListener('click', startReviewPractice);

  document.querySelectorAll('.tree-toggle').forEach(btn => {
    btn.addEventListener('click', () => {
      btn.closest('.tnode').classList.toggle('open');
    });
  });
  document.querySelectorAll('.remove-wrong-btn').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      const id = btn.getAttribute('data-id');
      const book = loadWrongBook();
      delete book[id];
      saveWrongBook(book);
      renderReviewView();
    });
  });
  const clearBtn = document.getElementById('clearAllWrongBtn');
  if (clearBtn) {
    clearBtn.addEventListener('click', () => {
      if (confirm('確定要清空所有錯題紀錄嗎？')) {
        saveWrongBook({});
        renderReviewView();
      }
    });
  }
}

navPractice.addEventListener('click', renderPracticeView);
navReview.addEventListener('click', renderReviewView);

renderSetSelectScreen();
initCloudSync();
</script>
